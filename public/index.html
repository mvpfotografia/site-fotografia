<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MVP Fotografia</title>
  <meta name="description" content="MVP Fotografia · Fotografia de eventos">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preload" as="image" imagesrcset="/img/entrada-1280.webp 1280w, /img/entrada-1920.webp 1920w, /img/entrada-2560.webp 2560w, /img/entrada-3840.webp 3840w" imagesizes="(max-aspect-ratio: 1557/1000) 156vh, 100vw">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="hero" id="hero">
    <!-- O browser escolhe o tamanho certo para o ecrã (incluindo ecrãs de alta resolução).
         Em ecrãs mais estreitos que a foto, ela cobre a altura (proporção 1,557), por isso precisa de 156vh de largura. -->
    <img class="hero-bg" id="hero-bg" alt="" aria-hidden="true" decoding="async" fetchpriority="high"
      src="/img/entrada-1920.webp"
      srcset="/img/entrada-1280.webp 1280w, /img/entrada-1920.webp 1920w, /img/entrada-2560.webp 2560w, /img/entrada-3840.webp 3840w"
      sizes="(max-aspect-ratio: 1557/1000) 156vh, 100vw">
    <h1 class="sr-only" id="h-name">MVP Fotografia</h1>
    <a class="btn fade-in" href="/fotos">Ver fotografias</a>
    <div class="hero-foot" data-site-foot></div>
  </main>
  <script type="module">
    import { initSite } from '/js/site.js';
    const layer = document.getElementById('hero-bg');
    const reveal = () => {
      void layer.offsetWidth; // garante que a transição começa do estado inicial
      layer.classList.add('in');
    };
    const site = await initSite('inicio', { overlay: true });
    document.title = site.name;
    document.getElementById('h-name').textContent = site.name;
    if (site.hero) {
      // Imagem escolhida no painel substitui a fotografia fixa
      const img = new Image();
      img.onload = () => { layer.removeAttribute('srcset'); layer.src = site.hero; reveal(); };
      img.onerror = reveal;
      img.src = site.hero;
    } else if (layer.complete && layer.naturalWidth) reveal();
    else { layer.onload = reveal; layer.onerror = reveal; }
  </script>
</body>
</html>
