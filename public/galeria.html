<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeria · MVP Fotografia</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main id="app"></main>
  <footer class="site-foot" data-site-foot></footer>

  <script type="module">
    import { api, esc, fmtDate, urls, renderGrid, lightbox, downloadMany, HEART } from '/js/common.js';
    import { initSite } from '/js/site.js';

    const app = document.getElementById('app');
    const slug = decodeURIComponent(location.pathname.split('/')[2] || '').toLowerCase();
    const DL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>';
    let site;

    async function load() {
      let g;
      try {
        g = await api(`/api/g/${encodeURIComponent(slug)}`);
      } catch (e) {
        app.innerHTML = `<div class="lock"><div><h1 class="g-title">Ups</h1><p class="muted">${esc(e.message)}</p><br><a class="btn" href="/fotos">Ver eventos</a></div></div>`;
        return;
      }
      document.title = `${g.title} · ${site.name}`;
      if (g.locked) return showLock(g);
      showGallery(g);
    }

    function showLock(g) {
      app.innerHTML = `
        <div class="lock" style="${g.cover ? `background-image:url('${esc(g.cover)}')` : ''}">
          <div>
            <h1 class="g-title">${esc(g.title)}</h1>
            <div class="g-meta">${esc(fmtDate(g.date))}</div>
            <form id="pw">
              <label class="lbl" for="pass">Palavra-passe da galeria</label>
              <input id="pass" type="password" autocomplete="current-password" required autofocus>
              <button class="btn">Ver fotografias</button>
              <div class="error" id="err"></div>
            </form>
          </div>
        </div>`;
      document.getElementById('pw').onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        try {
          await api(`/api/g/${slug}/login`, { method: 'POST', body: JSON.stringify({ password: document.getElementById('pass').value }) });
          load();
        } catch (er) {
          document.getElementById('err').textContent = er.message;
          btn.disabled = false;
        }
      };
    }

    function showGallery(g) {
      const u = urls(g);
      const favs = new Set(g.favoriteList);
      let onlyFavs = false;
      if (g.protect) document.addEventListener('contextmenu', (e) => { if (e.target.tagName === 'IMG') e.preventDefault(); });
      const meta = [fmtDate(g.date), `${g.photos.length} fotografias`].filter(Boolean).map(esc).join(' &nbsp;·&nbsp; ');
      const head = g.cover
        ? `<section class="g-hero" style="background-image:url('${esc(g.cover)}')"><div><h1 class="g-title">${esc(g.title)}</h1><div class="g-meta">${meta}</div></div></section>`
        : `<section class="g-head"><h1 class="g-title">${esc(g.title)}</h1><div class="g-meta">${meta}</div></section>`;
      app.innerHTML = `
        ${head}
        ${g.description ? `<p class="g-desc">${esc(g.description)}</p>` : ''}
        ${g.expires ? `<p class="g-desc muted" style="font-size:.85rem">Disponível até ${esc(fmtDate(g.expires))}</p>` : ''}
        <div class="toolbar">
          ${g.allowDownload ? `<button class="btn" id="dlall">${DL} <span>Descarregar todas</span></button>` : ''}
          ${g.favorites ? `<button class="btn ghost" id="favbtn">${HEART} <span></span></button>` : ''}
        </div>
        <div class="grid-wrap"><div class="grid" id="grid"></div></div>`;
      const grid = document.getElementById('grid');
      const current = () => (onlyFavs ? g.photos.filter((p) => favs.has(p.name)) : g.photos);
      const labels = () => {
        const fb = document.querySelector('#favbtn span');
        if (fb) fb.textContent = onlyFavs ? 'Ver todas' : `Favoritas (${favs.size})`;
        const db = document.querySelector('#dlall span');
        if (db) db.textContent = onlyFavs ? `Descarregar favoritas (${favs.size})` : 'Descarregar todas';
      };

      let saveTimer;
      const toggleFav = (name) => {
        favs.has(name) ? favs.delete(name) : favs.add(name);
        grid.querySelector(`.tile[data-name="${CSS.escape(name)}"] .fav`)?.classList.toggle('on', favs.has(name));
        labels();
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => api(`/api/g/${slug}/favorites`, { method: 'PUT', body: JSON.stringify({ favorites: [...favs] }) }).catch((e) => alert(e.message)), 600);
      };

      const draw = () => {
        const list = current();
        if (!list.length) { grid.innerHTML = `<div class="empty" style="width:100%">${onlyFavs ? 'Ainda não marcaste favoritas. Toca no ♥ das fotografias.' : 'Ainda não há fotografias nesta galeria.'}</div>`; return; }
        renderGrid(grid, list, u, {
          favs,
          onFav: g.favorites ? toggleFav : null,
          onOpen: (i) => lightbox(list, i, u, { favs, onFav: g.favorites ? toggleFav : null, allowDownload: g.allowDownload }),
        });
      };
      document.getElementById('favbtn')?.addEventListener('click', () => { onlyFavs = !onlyFavs; labels(); draw(); });
      document.getElementById('dlall')?.addEventListener('click', async () => {
        const list = current().map((p) => ({ name: p.name, url: u.original(p) }));
        if (!list.length) return;
        const bar = document.createElement('div');
        bar.className = 'progress';
        document.body.append(bar);
        try { await downloadMany(list, `${slug}.zip`, (t) => { bar.textContent = t; }); }
        catch (e) { bar.textContent = e.name === 'AbortError' ? 'Cancelado' : 'Erro: ' + e.message; }
        setTimeout(() => bar.remove(), 4000);
      });
      labels();
      draw();
    }

    site = await initSite('fotos', { overlay: true });
    load();
  </script>
</body>
</html>
