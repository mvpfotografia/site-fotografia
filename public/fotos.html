<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotografias · MVP Fotografia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <h1 class="sr-only">Eventos</h1>
    <div class="events-head">
      <form class="search" id="sf" role="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" placeholder="Procurar evento ou código da galeria" autocomplete="off" aria-label="Procurar">
      </form>
    </div>
    <div class="events" id="events"></div>
    <div class="empty hidden" id="none"></div>
  </main>
  <footer class="site-foot" data-site-foot></footer>
  <script type="module">
    import { api, esc, fmtDate } from '/js/common.js';
    import { initSite, fadeImg } from '/js/site.js';
    const LOCK = '<svg class="ev-lock" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    const shortDate = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString('pt-PT', { day: 'numeric', month: 'short', year: 'numeric' }).replace(/\./g, '') : '';
    const site = await initSite('fotos');
    document.title = 'Fotografias · ' + site.name;
    const list = await api('/api/galleries');
    const el = document.getElementById('events');
    // Cada capa mantém a sua proporção: as linhas têm todas a mesma altura e ocupam a largura toda
    const size = (a, r) => { a.style.flexGrow = r; a.style.width = `calc(var(--ev-h) * ${r})`; a.querySelector('i').style.paddingBottom = (100 / r) + '%'; };
    // Cada galeria tem capa horizontal e vertical: alterna-se com este ritmo para as linhas
    // misturarem fotos largas e estreitas. Se só houver uma, usa-se essa.
    const RHYTHM = ['h', 'v', 'v', 'h', 'v', 'h', 'h', 'v'];
    const pickCover = (g, i) => {
      const want = RHYTHM[i % RHYTHM.length], c = g.covers || {};
      return c[want] || c[want === 'h' ? 'v' : 'h'] || (g.cover ? { url: g.cover, ratio: g.coverRatio } : null);
    };
    el.innerHTML = list.map((g, i) => {
      const c = pickCover(g, i);
      return `
      <a class="event" href="/g/${esc(g.slug)}" data-q="${esc((g.title + ' ' + g.slug).toLowerCase())}" data-r="${+c?.ratio || ''}">
        <i></i>
        ${c ? `<img loading="lazy" src="${esc(c.url)}" alt="">` : ''}
        ${g.hasPassword ? LOCK : ''}
        <div class="t"><b>${esc(g.title)}</b><span>${esc(shortDate(g.date))}</span></div>
      </a>`;
    }).join('');
    el.querySelectorAll('.event').forEach((a) => {
      size(a, +a.dataset.r || 1.5);
      const img = a.querySelector('img');
      if (!img) return;
      // Galerias antigas ainda sem proporção guardada: usa a da imagem quando carregar
      if (!+a.dataset.r) img.addEventListener('load', () => img.naturalHeight && size(a, img.naturalWidth / img.naturalHeight));
      fadeImg(img);
    });
    const none = document.getElementById('none');
    const q = document.getElementById('q');
    const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
    const filter = () => {
      const v = norm(q.value);
      let n = 0;
      el.querySelectorAll('.event').forEach((a) => { const ok = !v || norm(a.dataset.q).includes(v); a.classList.toggle('hidden', !ok); n += ok; });
      none.classList.toggle('hidden', n > 0);
      none.innerHTML = list.length
        ? 'Nenhum evento encontrado. Se tens um código de galeria privada, carrega Enter.'
        : 'Ainda não há eventos publicados.';
    };
    q.oninput = filter;
    document.getElementById('sf').onsubmit = (e) => {
      e.preventDefault();
      const vis = [...el.querySelectorAll('.event:not(.hidden)')];
      if (vis.length === 1) location.href = vis[0].href;
      else if (!vis.length && q.value.trim()) location.href = '/g/' + encodeURIComponent(norm(q.value).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''));
    };
    filter();
  </script>
</body>
</html>
