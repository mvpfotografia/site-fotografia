name = "fotografia"
compatibility_date = "2025-06-01"
pages_build_output_dir = "public"

# Fotografias (pode ser público através de um subdomínio, ex: fotos.teudominio.pt)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fotografia"

# Dados internos (galerias, palavras-passe, favoritas): sempre privado
[[r2_buckets]]
binding = "DATA"
bucket_name = "fotografia-dados"

[vars]
# Depois de ligares um domínio ao bucket "fotografia", coloca-o aqui (sem / no fim):
# PUBLIC_BASE = "https://fotos.teudominio.pt"
PUBLIC_BASE = "https://fotos.mvpfotografia.com"
